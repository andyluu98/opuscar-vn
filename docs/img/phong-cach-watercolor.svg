<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Hình minh họa phong cách Màu nước"><title>Hình minh họa: Màu nước</title><defs>
<filter id="watercolorf" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="4" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="26"/>
<feGaussianBlur stdDeviation="1.6"/>
</filter>
<filter id="watercolorg"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
<feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.28  0 0 0 0.22 0"/></filter>
</defs>
<rect width="480" height="360" fill="#f6efe1"/>
<g filter="url(#watercolorf)">
<ellipse cx="120" cy="250" rx="150" ry="80" fill="#c8512b" opacity=".55"/>
<ellipse cx="170" cy="270" rx="140" ry="60" fill="#e0a13a" opacity=".55"/>
<ellipse cx="360" cy="200" rx="130" ry="100" fill="#2f8f83" opacity=".55"/>
<ellipse cx="340" cy="120" rx="110" ry="50" fill="#5aa9d6" opacity=".5"/>
<ellipse cx="230" cy="90" rx="120" ry="48" fill="#8fc7e8" opacity=".5"/>
<ellipse cx="400" cy="280" rx="90" ry="40" fill="#3d7a4a" opacity=".5"/>
</g>
<g filter="url(#watercolorf)" fill="none" stroke="#6b3b22" stroke-width="2.4" opacity=".55"><path d="M40 300 C 110 230, 190 270, 260 230 S 400 250, 450 200"/></g>
<rect width="480" height="360" filter="url(#watercolorg)"/></svg>